# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs
name: Node.js CI - prod

on:
  push:
    branches:  ['main']

concurrency:
  # A newer push to the same branch cancels the run still in progress.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Expose the GitHub Actions cache to Buildx
      uses: crazy-max/ghaction-github-runtime@v3

    - name: Warm Docker build cache
      # Runs before the build context gets any secrets, so none end up in the cache. The
      # compose builds below run on the same Buildx builder and reuse these layers.
      run: |
        docker buildx build --cache-from type=gha,scope=homebase-frontend-prod --cache-to type=gha,scope=homebase-frontend-prod,mode=max --target deployed --build-arg NODE_ENV=production -f Dockerfile .

    - run: make up-frontend
#     - run: make test

    - name: Docker compose push
      run: |
        docker login -u ${{ vars.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
        make docker-push-frontend

    - name: Set k8s kubeconfig file
      uses: qgxpagamentos/kubectl-set@v1
      with:
       # A base64 encoded reference to your authorization file (~/.kube/config)
       base64-kube-config: ${{ secrets.K8S_KUBE_CONFIG }}

    - name: Deploy to k8s
      run: |
       make k8s-deploy-prod
      env:
       K8S_NAMESPACE: ${{secrets.K8S_PROD_NAMESPACE}}
